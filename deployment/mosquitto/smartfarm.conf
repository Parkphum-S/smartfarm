# SMART FARM MQTT Broker Configuration Template
# Copy and adapt this file on Raspberry Pi:
# /etc/mosquitto/conf.d/smartfarm.conf

listener 1883 0.0.0.0

allow_anonymous false
password_file /etc/mosquitto/passwd/smartfarm.passwd
acl_file /etc/mosquitto/acl/smartfarm.acl

persistence true
persistence_location /var/lib/mosquitto/
autosave_interval 300
autosave_on_changes true

max_keepalive 300
max_connections -1
max_inflight_messages 20
max_queued_messages 1000
message_size_limit 65536

connection_messages true
log_dest file /var/log/mosquitto/mosquitto.log
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S
log_type error
log_type warning
log_type notice
log_type information